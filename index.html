<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="업무 포탈">
  <meta name="robots" content="noindex, nofollow">
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <meta name="theme-color" content="#006B8E">
  <meta name="description" content="자이C&A 모바일 업무 포탈 – SharePoint 주요 사이트 바로가기">

  <title>모바일 업무 포탈 | 자이C&A</title>

  <!-- Favicon (인라인 SVG, 별도 파일 불필요) -->
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23006B8E'/%3E%3Crect x='8' y='9' width='16' height='3' rx='1' fill='%23fff'/%3E%3Crect x='8' y='15' width='12' height='3' rx='1' fill='%23fff'/%3E%3Crect x='8' y='21' width='8' height='3' rx='1' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23006B8E'/%3E%3Crect x='44' y='50' width='92' height='16' rx='8' fill='%23fff'/%3E%3Crect x='44' y='82' width='72' height='16' rx='8' fill='%23fff'/%3E%3Crect x='44' y='114' width='52' height='16' rx='8' fill='%23fff'/%3E%3C/svg%3E">

  <!--
    ★ 폰트: iOS(Apple SD Gothic Neo) / Android(Roboto) 에서 서로 다르게 보이는 문제를
      Noto Sans KR 웹폰트로 통일합니다.
      ※ 사내 네트워크에서 Google Fonts 접근이 차단된 경우, 폰트 파일을 자체 호스팅하거나
         아래 세 줄을 제거하면 각 기기의 시스템 폰트로 fallback됩니다.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ──────────────────────────────────────
       Reset & CSS 변수
    ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #006B8E;
      --blue-d:  #005472;
      --blue-dd: #003D55;
      --surface: #F0F6FA;
      --card:    #FFFFFF;
      --txt-hi:  #111827;
      --txt-lo:  #64748B;
      --radius:  22px;
      --shadow:  0 4px 28px rgba(0,107,142,.11), 0 1px 4px rgba(0,0,0,.05);
    }

    body {
      /* iOS · Android 동일 폰트: Noto Sans KR → 시스템 fallback 순 */
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont,
                   'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      word-break: keep-all;
    }

    /* ──────────────────────────────────────
       HEADER
    ────────────────────────────────────── */
    .header {
      background: linear-gradient(150deg, #0082AA 0%, #005472 50%, #003D55 100%);
      color: #fff;
      padding: 32px 24px 28px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .header::before {
      content: '';
      position: absolute; top: -70px; right: -50px;
      width: 220px; height: 220px; border-radius: 50%;
      background: rgba(255,255,255,.07); pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute; bottom: -55px; left: -25px;
      width: 150px; height: 150px; border-radius: 50%;
      background: rgba(255,255,255,.05); pointer-events: none;
    }

    .header-brand {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin-bottom: 12px; position: relative;
    }
    .brand-name {
      font-size: 13px; font-weight: 500; letter-spacing: 1.5px;
      color: rgba(255,255,255,.80); text-transform: uppercase;
    }

    .header-title {
      font-size: 19px; font-weight: 900;
      letter-spacing: -0.8px; line-height: 1.2;
      position: relative;
    }

    .header-sub {
      font-size: 12px; font-weight: 400;
      color: rgba(255,255,255,.68); margin-top: 5px;
      position: relative;
    }

    .sharepoint-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 14px;
      background: rgba(255,255,255,.16);
      border: 1.5px solid rgba(255,255,255,.32);
      border-radius: 24px; padding: 9px 20px;
      font-size: 12.5px; font-weight: 600;
      color: rgba(255,255,255,.95);
      cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s ease; position: relative;
      letter-spacing: -0.2px;
    }
    .sharepoint-btn:active { background: rgba(255,255,255,.28); }

    .footer-mark {
      display: flex; justify-content: center; margin-bottom: 8px;
    }

    .header-logo-img {
      height: 28px; width: auto; object-fit: contain;
      filter: brightness(0) invert(1);
    }

    .footer-logo-img {
      height: 36px; width: auto; object-fit: contain;
    }

    /* ──────────────────────────────────────
       MAIN
    ────────────────────────────────────── */
    .main {
      flex: 1;
      padding: 28px 16px 40px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--txt-lo); margin-bottom: 16px;
    }
    .section-label::before {
      content: ''; display: block;
      width: 4px; height: 14px;
      background: var(--blue); border-radius: 3px; flex-shrink: 0;
    }

    /* ──────────────────────────────────────
       GRID
       모바일        : 2열
       태블릿(600+)  : 2열, 여백 확대
       태블릿가로(860+) : 4열
    ────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 600px) {
      .main { padding: 32px 24px 48px; }
      .grid { gap: 18px; }
    }

    @media (min-width: 860px) {
      .main { padding: 40px 32px 60px; }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    }

    @media (min-width: 1100px) {
      .grid { gap: 24px; }
    }

    /* ──────────────────────────────────────
       CARD
    ────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.9);
      padding: 30px 16px 24px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 상단 포인트 컬러 바 */
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent, var(--blue));
      border-radius: var(--radius) var(--radius) 0 0;
    }

    /* 카드 하단 미묘한 컬러 틴트 */
    .card::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(to top, color-mix(in srgb, var(--accent, var(--blue)) 4%, transparent), transparent);
      border-radius: 0 0 var(--radius) var(--radius);
      pointer-events: none;
    }

    .card:active {
      transform: scale(0.955);
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }

    @media (min-width: 600px) { .card { padding: 36px 22px 28px; } }
    @media (min-width: 860px) { .card { padding: 38px 24px 30px; } }

    /* ──────────────────────────────────────
       ICON BOX
       gradient 배경 → 더욱 입체감 있는 아이콘 영역
    ────────────────────────────────────── */
    .icon-box {
      width: 84px; height: 84px;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px; flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,.10);
      position: relative;
    }

    .icon-box svg { width: 46px; height: 46px; }
    .icon-box img { width: 50px; height: 50px; object-fit: contain; border-radius: 20px; }

    @media (min-width: 600px) {
      .icon-box { width: 92px; height: 92px; border-radius: 26px; }
      .icon-box svg { width: 52px; height: 52px; }
      .icon-box img { width: 56px; height: 56px; }
    }

    @media (min-width: 860px) {
      .icon-box { width: 86px; height: 86px; }
      .icon-box svg { width: 48px; height: 48px; }
    }

    /* ──────────────────────────────────────
       CARD 텍스트
    ────────────────────────────────────── */
    .card-title {
      font-size: 15px; font-weight: 800;
      color: var(--txt-hi);
      letter-spacing: -0.3px;
      line-height: 1.3; margin-bottom: 6px;
    }

    .card-desc {
      font-size: 11.5px; font-weight: 400;
      color: var(--txt-lo); line-height: 1.6;
    }

    @media (min-width: 600px) {
      .card-title { font-size: 16px; }
      .card-desc  { font-size: 12.5px; }
    }

    @media (min-width: 860px) {
      .card-title { font-size: 15px; }
      .card-desc  { font-size: 12px; }
    }

    /* ──────────────────────────────────────
       FOOTER
    ────────────────────────────────────── */
    .footer {
      padding: 18px 20px; text-align: center;
      background: #fff; border-top: 1px solid #E5EAF2;
    }

    .footer-brand {
      font-size: 14px; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--blue), var(--blue-d));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer-copy { font-size: 10.5px; color: #9CA3AF; margin-top: 3px; font-weight: 400; }

    .no-js-msg {
      text-align: center; padding: 48px 24px;
      font-size: 14px; color: var(--txt-lo); line-height: 1.7;
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="header">
    <div class="header-brand">
      <img src="./icons/logo-mark.png" alt="자이C&A" class="header-logo-img">
    </div>
    <h1 class="header-title">모바일 업무 포탈</h1>
    <p class="header-sub">주요 업무 시스템 바로가기</p>
    <button class="sharepoint-btn" id="spDownloadBtn" type="button" aria-label="SharePoint 앱 다운로드">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 1.5v7M3.5 5.5L7 9.5l3.5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      SharePoint 앱 다운로드
    </button>
  </header>

  <!-- ── MAIN ── -->
  <main class="main">
    <p class="section-label">업무포탈 바로가기</p>
    <div class="grid" id="grid" role="list" aria-label="업무포탈 바로가기 목록"></div>
    <noscript>
      <p class="no-js-msg">
        이 페이지는 JavaScript가 필요합니다.<br>
        브라우저 설정에서 JavaScript를 활성화한 후 새로고침해 주세요.
      </p>
    </noscript>
  </main>

  <!-- ── FOOTER ── -->
  <footer class="footer">
    <div class="footer-mark">
      <img src="./icons/logo-mark.png" alt="자이C&A" class="footer-logo-img">
    </div>
    <div class="footer-copy">© 2026 자이C&A Co., Ltd. All rights reserved.</div>
  </footer>


  <!-- ★ URL·아이콘·항목 수정은 app.js 상단 APP_DATA 배열에서 하세요 -->
  <script src="app.js" defer></script>


</body>
</html>
